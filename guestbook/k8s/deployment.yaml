apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-heon
spec:
  replicas: 5
  selector:
    matchLabels:
      app: guestbook_heon
  template:
    metadata:
      labels:
        app: guestbook_heon
    spec:
      containers:
        - name: web
          image: ghcr.io/dheon/guestbook_heon:v2
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: guestbook-heon-config
            - secretRef:
                name: guestbook-heon-secret
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
